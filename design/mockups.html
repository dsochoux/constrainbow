<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constrainbow design directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Fredoka:wght@500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #e9e7e2; font-family: system-ui, sans-serif; color: #222; }
  h1 { font-size: 20px; font-weight: 600; margin: 24px 24px 4px; }
  .sub { margin: 0 24px 20px; color: #555; font-size: 14px; }
  .row { display: flex; gap: 28px; padding: 0 24px 40px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .label { font-weight: 600; font-size: 15px; }
  .label span { font-weight: 400; color: #555; font-size: 13px; display: block; max-width: 340px; line-height: 1.4; margin-top: 2px; }
  .phone { width: 360px; height: 740px; border-radius: 36px; overflow: hidden; box-shadow: 0 0 0 10px #111, 0 20px 40px rgba(0,0,0,.25); margin: 10px; position: relative; }
  .screen { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 34px 14px 14px; box-sizing: border-box; gap: 14px; }
  .hdr { display: flex; align-items: center; width: 100%; justify-content: space-between; }
  .word { display: flex; gap: 2px; }
  .board { display: grid; grid-template-columns: repeat(5, 58px); gap: 8px; }
  .tile { width: 58px; height: 58px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; position: relative; font-size: 30px; }
  .kb { display: flex; flex-direction: column; gap: 6px; margin-top: auto; width: 100%; }
  .kr { display: flex; gap: 5px; justify-content: center; }
  .k { width: 29px; height: 46px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .k.wide { width: 44px; }
  .status { display: flex; gap: 8px; align-items: center; }

  /* A: Paper pop */
  .A { background: #fbf4e6; color: #1d1b20; font-family: 'Space Grotesk', sans-serif; }
  .A .wm span { font-family: 'Archivo Black'; font-size: 13px; width: 18px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #1d1b20; border-radius: 5px; background: #fff; box-shadow: 2px 2px 0 var(--c, #1d1b20); }
  .A .date { font-weight: 700; font-size: 15px; }
  .A .pill { border: 2px solid #1d1b20; border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 14px; background: #fff; box-shadow: 2px 2px 0 #1d1b20; }
  .A .tile { border: 2.5px solid #1d1b20; border-radius: 12px; background: #fff; box-shadow: 3px 3px 0 #1d1b20; font-family: 'Archivo Black'; }
  .A .tile.c { background: var(--tint); box-shadow: 3px 3px 0 var(--c); border-color: #1d1b20; }
  .A .tile.c::after { content: ''; position: absolute; top: 5px; left: 5px; width: 9px; height: 9px; background: var(--c); border-radius: var(--shape-r); transform: var(--shape-t); }
  .A .tile.sel { outline: 3px dashed #1d1b20; outline-offset: 3px; }
  .A .k { border: 2px solid #1d1b20; border-radius: 7px; background: #fff; box-shadow: 2px 2px 0 #1d1b20; font-weight: 700; }
  .A .k.off { background: #ddd6c8; box-shadow: none; color: #8a8478; }
  .A .desc { font-size: 14px; }

  /* B: Gumdrop */
  .B { background: #f3efff; color: #2a2346; font-family: 'Fredoka', sans-serif; }
  .B .wm span { font-weight: 700; font-size: 24px; color: var(--c, #2a2346); }
  .B .date { font-weight: 600; font-size: 16px; color: #7a72a3; }
  .B .pill { background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 15px; box-shadow: 0 3px 0 #d8d0f3; }
  .B .tile { border-radius: 14px; background: #fff; box-shadow: 0 4px 0 #d8d0f3; font-weight: 700; color: #2a2346; }
  .B .tile.c { background: var(--c); box-shadow: 0 4px 0 var(--d); color: #fff; }
  .B .tile.sel { transform: translateY(-3px); box-shadow: 0 7px 0 #b9aee8; outline: 3px solid #2a2346; }
  .B .k { background: #fff; border-radius: 9px; box-shadow: 0 3px 0 #d8d0f3; font-weight: 600; }
  .B .k.off { background: #e4def8; box-shadow: none; color: #a79fd0; }
  .B .desc { font-size: 15px; color: #5a5280; }

  /* C: Night prism */
  .C { background: #12121c; color: #f2f1f8; font-family: 'Outfit', sans-serif; }
  .C .wm span { font-weight: 800; font-size: 22px; letter-spacing: 0.5px; color: var(--c, #f2f1f8); }
  .C .date { font-weight: 600; color: #8e8ca6; }
  .C .pill { border: 1.5px solid #3a3950; border-radius: 10px; padding: 5px 12px; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
  .C .tile { border: 1.5px solid #34334a; border-radius: 10px; background: #1b1b28; font-weight: 600; }
  .C .tile.c { border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 16%, #1b1b28); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 45%, transparent); }
  .C .tile.sel { background: #2b2a3d; border-color: #f2f1f8; }
  .C .tile.c.sel { background: color-mix(in srgb, var(--c) 32%, #1b1b28); }
  .C .k { background: #24233a; border-radius: 7px; font-weight: 600; }
  .C .k.off { background: #17161f; color: #4a4960; }
  .C .desc { font-size: 14px; color: #a9a7c0; }
</style>
</head>
<body>
<h1>Constrainbow: three directions</h1>
<p class="sub">Same in-progress speed puzzle (11/15) in each. Selected tile: row 2, letter 4. Greyed keys can't go on that tile.</p>
<div class="row" id="row"></div>
<script>
const grid = [[0,4,2,0,0],[1,0,3,0,2],[2,0,3,0,1],[0,0,4,0,1]];
const letters = ["QUERY","TRI E","E I T","  U T"];
const sel = [1,3];
const off = new Set("UEITQRY".split(""));
const themes = {
  A: { name: "A. Paper pop", note: "Evolves today's look: same chunky borders and hard shadows, warmer paper background, a heavier display font, coloured tiles filled with a tint. A small shape in each coloured tile helps colour-blind players.",
       c: {1:["#e0352b","#fde0dc"],2:["#ff8a1f","#ffe7cc"],3:["#e6c200","#fff6c2"],4:["#3a3fd9","#dfe1ff"]} },
  B: { name: "B. Gumdrop", note: "Soft and toy-like: coloured tiles are solid candy colours with white letters and a raised 3D edge. Rounded friendly font. Bright and readable on a phone in a short video.",
       c: {1:["#ef4b5c","#c22d3e"],2:["#ff9a3c","#d0701a"],3:["#f5c400","#c69d00"],4:["#5b5bf0","#3d3dbf"]} },
  C: { name: "C. Night prism", note: "Dark mode first: tiles glow in their colour on a near-black background. Moody and high contrast. Colours pop hard on video, and it suits late-night players.",
       c: {1:["#ff4d6d"],2:["#ff9f43"],3:["#ffe14d"],4:["#6c7bff"]} },
};
const shapes = {1:["50%","none"],2:["2px","none"],3:["1px","rotate(45deg)"],4:["50% 50% 2px 2px","none"]};
const wmColors = ["#e0352b","#ff8a1f","#e6c200","#3a3fd9"];
const t3 = { A: wmColors, B: ["#ef4b5c","#ff9a3c","#f5c400","#5b5bf0"], C: ["#ff4d6d","#ff9f43","#ffe14d","#6c7bff"] };
const html = [];
for (const [k, th] of Object.entries(themes)) {
  const wm = "CONSTRAINBOW".split("").map((ch,i) => `<span style="--c:${t3[k][i%4]}">${ch}</span>`).join("");
  let board = "";
  grid.forEach((row,w) => row.forEach((c,l) => {
    const ch = (letters[w][l] || " ").trim();
    const isSel = w===sel[0] && l===sel[1];
    const col = c ? th.c[c] : null;
    const style = col ? `--c:${col[0]};--tint:${col[1]||""};--d:${col[1]||""};--shape-r:${shapes[c][0]};--shape-t:${shapes[c][1]}` : "";
    board += `<div class="tile ${c?'c':''} ${isSel?'sel':''}" style="${style}">${ch}</div>`;
  }));
  const rows = ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
  const kb = rows.map((r,i) => `<div class="kr">${i===2?'<div class="k wide">↺</div>':''}${r.split("").map(ch=>`<div class="k ${off.has(ch)?'off':''}">${ch}</div>`).join("")}${i===2?'<div class="k wide">⌫</div>':''}</div>`).join("");
  html.push(`<div class="col"><div class="label">${th.name}<span>${th.note}</span></div>
  <div class="phone ${k}"><div class="screen">
    <div class="hdr"><div class="wm word">${wm}</div><div class="date">11/15</div></div>
    <div class="desc">70,654 ways to solve today's puzzle</div>
    <div class="status"><div class="pill">0:27</div><div class="pill">Pause</div></div>
    <div class="board">${board}</div>
    <div class="kb">${kb}</div>
  </div></div></div>`);
}
document.getElementById("row").innerHTML = html.join("");
</script>
</body>
</html>

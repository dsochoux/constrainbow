# nginx setup for /dashboard (see project/dashboard.py). Goes in the constrainbow.com server block of
# /etc/nginx/sites-enabled/ on the server (the HTTPS one, managed by certbot), next to "location /".
#
# Set this up BEFORE deploying dashboard.py to a new server: until step 1 is in place, a visitor could
# send X-Dashboard-Auth themselves. (Done on constrainbow.com on 2026-11-16; the site config before the
# change is backed up in /root/nginx-site-backup-*.)
#
# 1. In the existing "location / { ... }" block, add this line, so a visitor can't send the header
#    themselves:
#        proxy_set_header X-Dashboard-Auth "";
#
# 2. Add this block. nginx asks for a username and password, and only then passes the request on,
#    marked with X-Dashboard-Auth: passed (the app answers /dashboard with a 404 without it):

location /dashboard {
    auth_basic "Constrainbow dashboard";
    auth_basic_user_file /etc/nginx/constrainbow.htpasswd;
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Dashboard-Auth "passed";
}

# 3. The password file. Danny runs this (it asks for the password twice):
#        ssh -t root@constrainbow.com 'printf "danny:%s\n" "$(openssl passwd -apr1)" > /etc/nginx/constrainbow.htpasswd && chown root:www-data /etc/nginx/constrainbow.htpasswd && chmod 640 /etc/nginx/constrainbow.htpasswd'
#
# 4. Check and reload: nginx -t && systemctl reload nginx

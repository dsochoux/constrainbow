# nginx setup for /static/ (the CSS, JavaScript, images and icons). Goes in the constrainbow.com
# server block of /etc/nginx/sites-enabled/ on the server (the HTTPS one, managed by certbot), next to
# "location /". (Done on constrainbow.com on 2026-11-20; the site config before the change is backed up in
# /root/nginx-site-backup-*.)
#
# nginx sends these files straight from disk instead of passing the request to the app, and sends them
# compressed: deploy.sh writes style.css.gz, eggs.css.gz and bundle.js.gz next to the originals on every
# deploy (gzip -9), and gzip_static sends those to any browser that accepts gzip (all of them) with no work
# per request. Anything without a .gz (word.js, the manifest, SVGs) is compressed as it's sent.
# Cache-Control matches what the app sent: browsers check for a newer version on every visit, so a deploy
# shows up right away.
#
# After editing: nginx -t && systemctl reload nginx

location /static/ {
    alias /srv/constrainbow/project/static/;
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;
    add_header Cache-Control "no-cache";
}
